version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: calmora-postgres
    environment:
      POSTGRES_USER: calmora
      POSTGRES_PASSWORD: calmora123
      POSTGRES_DB: calmora_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calmora"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calmora-backend
    environment:
      DATABASE_URL: "postgresql://calmora:calmora123@postgres:5432/calmora_db?schema=public"
      PORT: 4000
      JWT_SECRET: "super_secret_dev_key"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    command: sh -c "npx prisma migrate deploy && npm start"

volumes:
  postgres_data:

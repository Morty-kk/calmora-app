version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: calmora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: calmora
      POSTGRES_PASSWORD: calmora123
      POSTGRES_DB: calmora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calmora"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calmora-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://calmora:calmora123@postgres:5432/calmora
      PORT: 4000
      JWT_SECRET: your-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma

volumes:
  postgres_data:
